[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    integration: requires a running VPP instance with the plugin loaded
    slow: takes more than a few seconds (load tests, pcap replays)
    model: requires Moonshine model files in models/ (fetch.sh)
